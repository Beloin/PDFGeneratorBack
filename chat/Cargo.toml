[package]
name = "chat"
version = "0.1.0"
edition = "2024"

[dependencies]
rmcp = { version = "3.10", features = ["client", "transport-streamable-http-client-reqwest"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
async-trait = "0.1"
dotenvy = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Postgres for chat persistence; NoTls (localhost, no TLS deps).
tokio-postgres = "0.7"
